<!-- Navigation Component -->
<script src="local-storage.js"></script>
<nav class="fixed top-0 left-0 right-0 bg-gradient-to-r from-blue-900 to-purple-900 shadow-lg z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <h1 class="text-white font-bold text-xl">EcoGrid AI</h1>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/dashboard" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">Dashboard</a>
                        <a href="/forecasting" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">Forecasting</a>
                        <a href="/multigrid" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">Multi-Grid</a>
                        <a href="/setup" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">Setup</a>
                    </div>
                </div>
            </div>
            <div class="hidden md:block">
                <div class="ml-4 flex items-center md:ml-6">
                    <div class="relative" id="userMenu">
                        <!-- User menu will be populated by JavaScript -->
                    </div>
                </div>
            </div>
            <div class="-mr-2 flex md:hidden">
                <button onclick="toggleMobileMenu()" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-white/20 focus:outline-none">
                    <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <!-- Mobile menu -->
    <div class="md:hidden hidden" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a href="/dashboard" class="text-white hover:bg-white/20 block px-3 py-2 rounded-md text-base font-medium">Dashboard</a>
            <a href="/forecasting" class="text-white hover:bg-white/20 block px-3 py-2 rounded-md text-base font-medium">Forecasting</a>
            <a href="/multigrid" class="text-white hover:bg-white/20 block px-3 py-2 rounded-md text-base font-medium">Multi-Grid</a>
            <a href="/setup" class="text-white hover:bg-white/20 block px-3 py-2 rounded-md text-base font-medium">Setup</a>
            <div id="mobileUserMenu">
                <!-- Mobile user menu will be populated by JavaScript -->
            </div>
        </div>
    </div>
</nav>

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }

    function updateUserMenu() {
        const userData = getUserData();
        const isGuest = isGuestUser();
        const userMenu = document.getElementById('userMenu');
        const mobileUserMenu = document.getElementById('mobileUserMenu');

        if (isGuest) {
            // Guest user menu
            userMenu.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <div class="text-white text-sm font-medium">Guest User</div>
                        <div class="text-gray-300 text-xs">Local data only</div>
                    </div>
                    <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center text-white font-bold">?</div>
                    <button onclick="clearGuestDataAndLogout()" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        Clear Data
                    </button>
                    <button onclick="showLoginModal()" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        Sign In
                    </button>
                </div>
            `;
            mobileUserMenu.innerHTML = `
                <div class="border-t border-gray-600 pt-2 mt-2">
                    <div class="text-gray-300 text-sm px-3 py-1">Guest User</div>
                    <button onclick="clearGuestDataAndLogout()" class="text-white hover:bg-white/20 block w-full text-left px-3 py-2 rounded-md text-base font-medium">Clear Local Data</button>
                    <button onclick="showLoginModal()" class="text-white hover:bg-white/20 block w-full text-left px-3 py-2 rounded-md text-base font-medium">Sign In</button>
                </div>
            `;
        } else {
            // Logged-in user menu
            const userName = userData ? userData.name : 'User';
            const userEmail = userData ? userData.email : '';
            userMenu.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <div class="text-white text-sm font-medium">${userName}</div>
                        <div class="text-gray-300 text-xs">${userEmail}</div>
                    </div>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold" style="background: var(--copper);">
                        ${userName.charAt(0).toUpperCase()}
                    </div>
                    <button onclick="logout()" class="text-white hover:bg-white/20 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        Logout
                    </button>
                </div>
            `;
            mobileUserMenu.innerHTML = `
                <div class="border-t border-gray-600 pt-2 mt-2">
                    <div class="text-gray-300 text-sm px-3 py-1">${userName}</div>
                    <button onclick="logout()" class="text-white hover:bg-white/20 block w-full text-left px-3 py-2 rounded-md text-base font-medium">Logout</button>
                </div>
            `;
        }
    }

    function clearGuestDataAndLogout() {
        if (confirm('This will clear all your local data. Are you sure?')) {
            clearGuestData();
            window.location.href = '/';
        }
    }

    function showLoginModal() {
        window.location.href = '/';
    }

    async function logout() {
        try {
            // Clear localStorage data
            clearAllData();
            
            // Call backend logout if logged in
            if (!isGuestUser()) {
                const response = await fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
            }
            
            window.location.href = '/';
        } catch (error) {
            console.error('Logout error:', error);
            clearAllData();
            window.location.href = '/';
        }
    }

    // Update menu on page load
    document.addEventListener('DOMContentLoaded', updateUserMenu);
</script>
